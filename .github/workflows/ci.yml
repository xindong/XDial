name: CI

on:
  push:
    branches: [main, xdial-beta]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  android:
    name: Android (dual ABI + inspected APK artifacts)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: install pinned Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: build and inspect debug and unsigned release APKs
        run: python3 scripts/build-android.py --mode ci
      - name: version, artifact and real signing contract tests
        run: |
          for abi in arm64-v8a x86_64; do
            XDIAL_ANDROID_TEST_ABI="$abi" \
            XDIAL_ANDROID_TEST_APK="$PWD/android/app/build/outputs/apk/release/app-$abi-release-unsigned.apk" \
              python3 -m unittest discover -s scripts/tests -p 'test_android_build.py'
          done
      - uses: ./.github/actions/package-size
        with:
          group: android
          paths: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
            android/app/build/outputs/apk/release/app-x86_64-release-unsigned.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-play-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      # These contain only the public source build. Public-repo artifacts are
      # not private distribution; no company seed or long-lived signer is used.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: build/android/artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Beta shares the formal identity, configuration library, App Group and
  # helper with stable, so xdial-beta may not change the files whose formats
  # evolve only through main. This job only reports; release.yml and
  # publish-release.py run the same script before a beta is built or public.
  beta-shared-formats:
    name: xdial-beta keeps main's shared formats
    if: github.ref == 'refs/heads/xdial-beta' || github.base_ref == 'xdial-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: dependencies, patches and configuration library format match main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          scripts/check-beta-shared-formats.sh origin/main HEAD

  go:
    name: Go (lint + vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: public content gate
        run: make public-content-gate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt gate
        run: |
          unformatted=$(gofmt -l core/ cmd/ tools/)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt:" && echo "$unformatted" && exit 1
          fi
      - name: prepare patched Go dependencies
        run: make prepare-patched-go
      - name: go vet
        run: make go-vet
      - name: go build
        run: make go-build
      - name: install sing-box test validator
        run: |
          make sing-box-test-validator
          echo "$PWD/build/tools" >> "$GITHUB_PATH"
      - name: go test
        run: make test
      - name: package size report contract tests
        run: python3 -m unittest discover -s scripts/tests -p test_package_size.py -v
      - name: tvOS preset acceptance gates
        run: python3 -m unittest discover -s scripts/tests -p test_tvos_store_app.py -v

  macos:
    name: macOS (swift compile + tests)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: install macOS build tools
        run: |
          brew install ripgrep xcodegen
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: compile Debug and Release without distribution signing
        run: make ci-macos-build
      - name: connection transaction tests
        run: make test-macos-transaction MACOS_TEST_XCODEBUILD_FLAGS=CODE_SIGNING_ALLOWED=NO
      # The Debug run above only reaches the Debug identity's branches; the
      # formal identity (stable and beta releases) is asserted here.
      - name: formal identity tests (Release configuration, unsigned)
        run: |
          xcodebuild -project macos/XDial.xcodeproj -scheme XDialTests \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/macos-tests-release \
            CODE_SIGNING_ALLOWED=NO test

      - uses: ./.github/actions/package-size
        with:
          group: macos-standalone
          paths: build/macos-xcode-ci/Build/Products/Release/XDial.app

  apple-store-size:
    name: Store package size (${{ matrix.platform }})
    # Xcode 26.6 crashes emitting tvOS Swift IR; Xcode 27 matches local archives.
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: iOS, make: libbox-ios-xcframework, spec: ios/project.yml, project: ios/XDialIOS, scheme: XDialIOS, app: XDial}
          - {platform: tvOS, make: libbox-xcframework, spec: appletv/project.yml, project: appletv/XDialTV, scheme: XDialTV, app: XDialTV}
          - {platform: macOS, make: libbox-macos-xcframework, spec: macos/store.yml, project: macos/XDialStore, scheme: XDialStore, app: XDial}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the host and its extension for device architectures
        run: |
          brew install xcodegen ripgrep
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          make ${{ matrix.make }}
          if [ "${{ matrix.platform }}" = tvOS ]; then
            # CI uses a public license fixture. Distribution supplies the verified inventory.
            mkdir -p appletv/StoreResources
            cp LICENSE appletv/StoreResources/ThirdPartyNotices.txt
          fi
          xcodegen generate --spec ${{ matrix.spec }}
          xcodebuild -project ${{ matrix.project }}.xcodeproj -scheme ${{ matrix.scheme }} \
            -configuration Release -destination 'generic/platform=${{ matrix.platform }}' \
            -archivePath build/Store.xcarchive CODE_SIGNING_ALLOWED=NO archive
          python3 scripts/verify-shared-libbox.py build/Store.xcarchive/Products/Applications/${{ matrix.app }}.app
      - uses: ./.github/actions/package-size
        with:
          group: store-${{ matrix.platform }}
          paths: build/Store.xcarchive/Products/Applications/${{ matrix.app }}.app

  linux-size:
    name: Linux service package size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          scripts/build-linux-service.sh amd64
          scripts/build-linux-service.sh arm64
      - uses: ./.github/actions/package-size
        with:
          group: linux
          paths: |
            build/linux-service/xdial-service-linux-amd64.tar.gz
            build/linux-service/xdial-service-linux-arm64.tar.gz
      - run: echo "Windows — no distributable client on this revision." >> "$GITHUB_STEP_SUMMARY"
