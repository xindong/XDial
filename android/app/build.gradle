plugins { id 'com.android.application' }
def versionContract = new Properties()
rootProject.file('version.properties').withInputStream { versionContract.load(it) }
def requestedCode = providers.environmentVariable('XDIAL_ANDROID_VERSION_CODE').getOrElse(versionContract.versionCode)
def requestedName = providers.environmentVariable('XDIAL_ANDROID_VERSION_NAME').getOrElse(versionContract.versionName)
if (!(requestedCode ==~ /[1-9][0-9]*/) || requestedCode.toBigInteger() > 2100000000) {
 throw new GradleException('XDIAL_ANDROID_VERSION_CODE must be between 1 and 2100000000')
}
if (!(requestedName ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:[-+.][A-Za-z0-9.-]+)?/)) {
 throw new GradleException('Invalid Android version name')
}
android {
 namespace 'com.xd.xdial.android'
 compileSdk 36
 buildToolsVersion '36.0.0'
 defaultConfig {
  applicationId 'com.xd.xdial.android'
  minSdk 26
  targetSdk 36
  versionCode requestedCode.toInteger()
  versionName requestedName
 }
 splits {
  abi {
   enable = providers.gradleProperty('xdialSplitApks').getOrElse('false').toBoolean()
   reset()
   include 'arm64-v8a', 'x86_64'
   universalApk = false
  }
 }
 // Release stays unsigned in Gradle. The packaging tool signs a copy and
 // verifies its pinned certificate; passwords never enter Gradle's daemon.
 buildTypes { debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' } }
}
dependencies { implementation files('../../build/android/Libbox.aar') }
