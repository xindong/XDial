name: XDialStore
options:
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release
  AppStore: release
# 出口合规（ITSAppUsesNonExemptEncryption）只写在 Debug 和 Release：TestFlight 构建继续
# 预填 false（理由见 ios/project.yml）。正式上架用 AppStore 配置归档（`-configuration AppStore`），
# 它与 Release 相同但不预填这个键，由 App Store Connect 按实际发行地区回答。
settings:
  base:
    XDIAL_ICLOUD_CONTAINER: iCloud.com.xd.xdial
    XDIAL_ICLOUD_ENVIRONMENT: Production
    DEVELOPMENT_TEAM: SX9RG894L5
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) XDIAL_STORE"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Distribution
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    XDIAL_PRODUCT_DISPLAY_NAME: XDial
    XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER: com.xd.xdial.ios.tunnel
    XDIAL_BUILD_FLAVOR: store
    XDIAL_SETTINGS_ENTRY_IDENTIFIER: com.xd.xdial.ios.settings-entry
    XDIAL_SOURCE_REVISION: unversioned
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  XDialStore:
    type: application
    platform: macOS
    sources:
      - Sources/XDial
      - Shared
      - ../apple/Home
      - ../apple/Sync
      - ../apple/Notifications
      - ../apple/CloudHost
      - ../ios/XDialShared/DialGlyph.swift
      - ../ios/XDialIOS/LocalTailscaleSetupRuntime.swift
      - Store/StoreTailscale.swift
      - Store/Host/PrivacyInfo.xcprivacy
      - AppIcon.icns
    info:
      path: Store/Host-Info.plist
      properties:
        XDialCloudContainer: $(XDIAL_ICLOUD_CONTAINER)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleDisplayName: XDial
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSLocationUsageDescription: XDial uses Wi-Fi names for automatic scenario selection.
        NSLocationWhenInUseUsageDescription: XDial uses Wi-Fi names for automatic scenario selection.
        XDialTransparentProxyBundleIdentifier: "$(XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER)"
        XDialSourceRevision: "$(XDIAL_SOURCE_REVISION)"
        XDialBuildFlavor: store
        # 与 App Store Connect 填写的隐私政策一致；数据使用说明和设置里链接到这里。
        XDialPrivacyPolicyURL: https://xindong.github.io/XDial/privacy/
    settings:
      base:
        PRODUCT_NAME: XDial
        PRODUCT_BUNDLE_IDENTIFIER: com.xd.xdial.ios
        PROVISIONING_PROFILE_SPECIFIER: XDial macOS TestFlight Host
        CODE_SIGN_ENTITLEMENTS: Store/Host.entitlements
        # The preset embed reads the private configuration directory named at build time.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Lets the per-configuration INFOPLIST_KEY below merge into Store/Host-Info.plist.
        GENERATE_INFOPLIST_FILE: true
      configs:
        # TestFlight answer; AppStore leaves it unset (see configs at the top).
        Debug:
          INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        Release:
          INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
    postBuildScripts:
      - name: Embed company preset
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          "${SRCROOT}/scripts/embed-private-seed.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}" "${SRCROOT}"
    dependencies:
      - target: XDialStoreProxy
      - framework: ../build/shared/macos/Libbox.xcframework
        embed: true
      - sdk: libresolv.tbd
  XDialStoreProxy:
    type: app-extension
    platform: macOS
    sources:
      - path: TransparentProxyExtension
        excludes:
          - main.swift
          - Info.plist
          - "*.entitlements"
      - Shared
      - Store/Provider/PrivacyInfo.xcprivacy
    info:
      path: Store/Provider-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleDisplayName: XDial Network Extension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.app-proxy
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).TransparentProxyProvider"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: "$(XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER)"
      PROVISIONING_PROFILE_SPECIFIER: XDial macOS TestFlight Provider
      CODE_SIGN_ENTITLEMENTS: Store/Provider.entitlements
      SKIP_INSTALL: YES
      # The rule embed reads the private config directory named at build time.
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Same as the Developer ID extension: the company's bundled China rule
      # sets let the first connection in China succeed when downloads fail.
      - name: Embed enterprise offline rules
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          source_dir="${XDIAL_PRIVATE_CONFIG_DIR:-${XDIAL_IOS_PRIVATE_CONFIG_DIR:-${SRCROOT}/../ios/PrivateConfig}}/RuleSets"
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/SeedProfile/RuleSets"
          rm -rf "${destination}"
          if [ -f "${source_dir}/manifest.json" ]; then
            mkdir -p "${destination}"
            cp "${source_dir}/manifest.json" "${destination}/"
            for rule in "${source_dir}"/*.srs; do
              if [ -f "${rule}" ]; then cp "${rule}" "${destination}/"; fi
            done
          else
            rmdir "${destination%/*}" 2>/dev/null || true
          fi
    dependencies:
      - framework: ../build/shared/macos/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
